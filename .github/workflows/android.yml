name: Android APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        working-directory: gradle
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ] || [ -z "${KS_ALIAS:-}" ] || [ -z "${KS_PASS:-}" ] || [ -z "${KEY_PASS:-}" ]; then
            echo "::error::All four Android signing secrets must be configured. Refusing to build or publish with a temporary key."
            exit 1
          fi
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          if ! printf '%s' "$KS_B64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid Base64. Refusing to build or publish."
            exit 1
          fi
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded Android keystore is empty. Refusing to build or publish."
            exit 1
          fi
          printf '%s\n' "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s\n' "ANDROID_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          printf '%s\n' "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          printf '%s\n' "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "Using the persistent signing keystore from repository secrets."

      - name: Build signed release APK and AAB
        working-directory: gradle
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" :app:assembleRelease :app:bundleRelease --stacktrace
          mkdir -p release-out
          apk_path=$(find app/build/outputs/apk/release -type f -name 'app-release.apk' | head -n 1)
          aab_path=$(find app/build/outputs -type f -name 'app-release.aab' | head -n 1)
          test -n "$apk_path"
          test -n "$aab_path"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          report=$("$apksigner" verify --verbose --print-certs "$apk_path")
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
          cp "$apk_path" release-out/app-release.apk
          cp "$aab_path" release-out/app-release.aab
          ls -lh release-out

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apocalyptic-ai-android
          path: gradle/release-out/*

  publish-release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apocalyptic-ai-android
          path: release-files
      - name: Publish APK and AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Apocalyptic AI v1.0.${{ github.run_number }}
          body: |
            `app-release.apk` is signed with v1 + v2 + v3 (RSA-2048), supports Android 7+ and targets Android 16 (API 36).
            If you installed an older build signed with a different key, uninstall it first.
          generate_release_notes: true
          prerelease: true
          files: |
            release-files/app-release.apk
            release-files/app-release.aab
