name: Android APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare private release signing
        working-directory: gradle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 repository secret'; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore
      - name: Build signed release APK and signed release AAB
        working-directory: gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing Android signing secrets'; exit 1; }
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          mkdir -p release-out
          apk_path=$(find app/build/outputs -type f \( -name 'app-release.apk' -o -name 'app-release-unsigned.apk' \) | head -n 1)
          aab_path=$(find app/build/outputs -type f -name 'app-release.aab' | head -n 1)
          test -n "$apk_path"
          test -n "$aab_path"
          cp "$apk_path" release-out/app-release.apk
          cp "$aab_path" release-out/app-release.aab
          test -s release-out/app-release.apk
          test -s release-out/app-release.aab
          ls -lh release-out
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apocalyptic-ai-android
          path: gradle/release-out/*

  publish-release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apocalyptic-ai-android
          path: release-files
      - name: Publish APK and AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Apocalyptic AI v1.0.${{ github.run_number }}
          generate_release_notes: true
          prerelease: true
          files: |
            release-files/app-release.apk
            release-files/app-release.aab
