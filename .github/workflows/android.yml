name: Android APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK and release AAB
        working-directory: gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          mkdir -p release-out
          find app/build/outputs -type f -name 'app-release.apk' -exec cp {} release-out/app-release.apk \;
          find app/build/outputs -type f -name 'app-release.aab' -exec cp {} release-out/app-release.aab \;
          test -s release-out/app-release.apk
          test -s release-out/app-release.aab
          ls -lh release-out
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apocalyptic-ai-android
          path: gradle/release-out/*

  publish-release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apocalyptic-ai-android
          path: release-files
      - name: Publish APK and AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Apocalyptic AI v1.0.${{ github.run_number }}
          generate_release_notes: true
          prerelease: true
          files: |
            release-files/app-release.apk
            release-files/app-release.aab
