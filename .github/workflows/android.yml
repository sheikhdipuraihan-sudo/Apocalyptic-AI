name: Android APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and release AAB
        working-directory: gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apocalyptic-ai-android
          path: |
            gradle/app/build/outputs/apk/debug/app-debug.apk
            gradle/app/build/outputs/bundle/release/app-release.aab
