plugins { id 'com.android.application' }

def releaseKeystore = rootProject.file('release.keystore')
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) { signingPropertiesFile.withInputStream { signingProperties.load(it) } }
def hasReleaseSigning = releaseKeystore.exists() && signingProperties.getProperty('storePassword')
android { namespace 'bd.sites.raihan.apocalypticai'; compileSdk 35
    defaultConfig {
        applicationId 'bd.sites.raihan.apocalypticai'
        minSdk 24
        targetSdk (project.findProperty('appTargetSdk') ?: '35').toString().toInteger()
        versionCode (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
        versionName (project.findProperty('appVersionName') ?: '1.0.0').toString()
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystore
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
            enableV1Signing true
            enableV2Signing (project.findProperty('enableV2Signing') ?: 'true').toString().toBoolean()
        }
    }
    dependencies { implementation project(':lib') }
    buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}
