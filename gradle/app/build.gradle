plugins { id 'com.android.application' }

def releaseKeystore = rootProject.file('release.keystore')
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) { signingPropertiesFile.withInputStream { signingProperties.load(it) } }
def hasReleaseSigning = releaseKeystore.exists() && signingProperties.getProperty('storePassword')
def appTargetSdkValue = rootProject.hasProperty('appTargetSdk') ? rootProject.property('appTargetSdk').toString().toInteger() : 35
def appVersionCodeValue = rootProject.hasProperty('appVersionCode') ? rootProject.property('appVersionCode').toString().toInteger() : 1
def appVersionNameValue = rootProject.hasProperty('appVersionName') ? rootProject.property('appVersionName').toString() : '1.0.0'
def v2SigningEnabled = rootProject.hasProperty('enableV2Signing') ? rootProject.property('enableV2Signing').toString().toBoolean() : true
android { namespace 'bd.sites.raihan.apocalypticai'; compileSdk 35
    defaultConfig {
        applicationId 'bd.sites.raihan.apocalypticai'
        minSdk 24
        targetSdk appTargetSdkValue
        versionCode appVersionCodeValue
        versionName appVersionNameValue
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystore
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
            enableV1Signing true
            enableV2Signing v2SigningEnabled
        }
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}

dependencies {
    implementation project(':lib')
    implementation 'com.caverock:androidsvg-aar:1.4'
}
