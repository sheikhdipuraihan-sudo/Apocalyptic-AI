plugins { id 'com.android.application' }

// Signing: reads gradle/signing.properties (local, git-ignored) or ANDROID_* environment variables (CI).
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) { signingPropertiesFile.withInputStream { signingProperties.load(it) } }
def signingValue = { String prop, String env -> System.getenv(env) ?: signingProperties.getProperty(prop) }
def keystorePath = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')
def releaseKeystore = keystorePath ? (new File(keystorePath).isAbsolute() ? new File(keystorePath) : rootProject.file(keystorePath)) : null
def hasReleaseSigning = releaseKeystore != null && releaseKeystore.exists() && signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def appTargetSdkValue = rootProject.hasProperty('appTargetSdk') ? rootProject.property('appTargetSdk').toString().toInteger() : 36
def appVersionCodeValue = rootProject.hasProperty('appVersionCode') ? rootProject.property('appVersionCode').toString().toInteger() : 1
def appVersionNameValue = rootProject.hasProperty('appVersionName') ? rootProject.property('appVersionName').toString() : '1.0.0'
android { namespace 'bd.sites.raihan.apocalypticai'; compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'bd.sites.raihan.apocalypticai'
        minSdk 24
        targetSdk appTargetSdkValue
        versionCode appVersionCodeValue
        versionName appVersionNameValue
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile releaseKeystore
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
        // Extract native libs at install time: more compatible with MediaTek/XOS and old Android installers.
        jniLibs { useLegacyPackaging = true }
    }
}

dependencies {
    implementation project(':lib')
    implementation 'com.caverock:androidsvg-aar:1.4'
}
